[project]
name = "ptgcore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["deal", "lancedb", "memcore", "memshell", "numpy", "ptg-mem", "ptgfull", "pyarrow"]

[tool.setuptools.packages.find]
include = ["ptgcore*"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["lancedb", "lancedb.*", "memcore", "memcore.*", "memshell", "memshell.*", "numpy", "numpy.*", "ptg_mem", "ptg_mem.*", "ptgfull", "ptgfull.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "B", "C90", "TID251", "S", "T20"]
ignore = ["E501", "S101", "F401"]  # F401: импорты карточки объявляют зависимости до того, как их вызовет код

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os".msg = "файловая система и процессы — только в узле с effects: io"
"subprocess".msg = "процессы — только в узле с effects: io"
"socket".msg = "сеть — только в узле с effects: io"
"shutil".msg = "файловая система — только в узле с effects: io"
"urllib".msg = "сеть — только в узле с effects: io"
"http".msg = "сеть — только в узле с effects: io"
"ctypes".msg = "машинный код — не допускается"
"importlib".msg = "динамический импорт — не допускается"

[tool.ruff.lint.per-file-ignores]
"ptgcore.py" = ["TID251", "T20"]
"ptgcore/**" = ["TID251", "T20"]
"ptgcore/codegraph.py" = ["TID251", "T20"]
"ptgcore/codegraph/**" = ["TID251", "T20"]
"ptgcore/codegraph/scan.py" = ["TID251", "T20"]
"ptgcore/codegraph/scan/**" = ["TID251", "T20"]
"ptgcore/intake.py" = ["TID251", "T20"]
"ptgcore/intake/**" = ["TID251", "T20"]
"ptgcore/intake/listing.py" = ["TID251", "T20"]
"ptgcore/intake/listing/**" = ["TID251", "T20"]
"ptgcore/intake/reading.py" = ["TID251", "T20"]
"ptgcore/intake/reading/**" = ["TID251", "T20"]
"ptgcore/intake/sessions.py" = ["TID251", "T20"]
"ptgcore/intake/sessions/**" = ["TID251", "T20"]
"ptgcore/ledger.py" = ["TID251", "T20"]
"ptgcore/ledger/**" = ["TID251", "T20"]
"ptgcore/ledger/entry_table.py" = ["TID251", "T20"]
"ptgcore/ledger/entry_table/**" = ["TID251", "T20"]
"ptgcore/ledger/file_table.py" = ["TID251", "T20"]
"ptgcore/ledger/file_table/**" = ["TID251", "T20"]
"ptgcore/migration.py" = ["TID251", "T20"]
"ptgcore/migration/**" = ["TID251", "T20"]
"ptgcore/migration/disk.py" = ["TID251", "T20"]
"ptgcore/migration/disk/**" = ["TID251", "T20"]
"ptgcore/relations.py" = ["TID251", "T20"]
"ptgcore/relations/**" = ["TID251", "T20"]
"ptgcore/relations/table.py" = ["TID251", "T20"]
"ptgcore/relations/table/**" = ["TID251", "T20"]
"ptgcore/retrieval.py" = ["TID251", "T20"]
"ptgcore/retrieval/**" = ["TID251", "T20"]

[tool.pytest.ini_options]
addopts = "--doctest-modules -q -p no:cacheprovider"
testpaths = ["ptgcore", "tests"]
