name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (no model backends — tests use the hash embedder)
        run: python -m pip install -e ".[test]"
      - name: tests
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          ptg --help
          python -m ptg_mem --help

  full-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install the four engine packages (no model backends)
        run: |
          python -m pip install -e ".[test]" -e rev -e rev-shell -e rev-full -e rev-core
          python -m pip install lancedb pyarrow markitdown chonkie detect-secrets pathspec deal hypothesis networkx scipy
      - name: memcore
        working-directory: rev
        run: python -m pytest
      - name: memshell
        working-directory: rev-shell
        run: python -m pytest
      - name: ptgfull
        working-directory: rev-full
        run: python -m pytest
      - name: ptgcore
        working-directory: rev-core
        run: python -m pytest
      - name: daemon engines on the full stack
        run: python -m pytest -q tests/test_engine3.py
