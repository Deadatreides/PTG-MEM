name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (no model backends — tests use the hash embedder)
        run: python -m pip install -e ".[test]"
      - name: tests
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          ptg --help
          python -m ptg_mem --help
