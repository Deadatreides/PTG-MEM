[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptg-mem"
version = "0.2.0"
description = "Chaos on your disk, order in your AI's context: local memory for Claude Code and Codex that knows what was replaced, plus a code map for legacy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Deadatreides" }]
keywords = ["claude-code", "codex", "mcp", "memory", "agents", "context", "knowledge-graph", "legacy-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]
dependencies = [
  "numpy>=1.24",
  "requests>=2.28",
  "mcp>=1.2",
  "watchdog>=3",
  "cryptography>=41",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3", "torch"]
gguf = ["llama-cpp-python>=0.3"]
docs = ["olefile"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Deadatreides/PTG-MEM"
Issues = "https://github.com/Deadatreides/PTG-MEM/issues"

[project.scripts]
ptg = "ptg_mem.cli:main"
ptg-hook = "ptg_mem.hooks:main"
ptg-mcp = "ptg_mem.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ptg_mem*"]

[tool.setuptools.package-data]
ptg_mem = ["gui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
